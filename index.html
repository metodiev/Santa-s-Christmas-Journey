<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#050b1c" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' ws: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'"
    />
    <meta name="description" content="Santa's Christmas Journey — a hand-crafted Christmas platform adventure across five towns." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Santa's Journey" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="./icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Santa's Christmas Journey</title>
  </head>
  <body>
    <div id="game-root" role="application" aria-label="Santa's Christmas Journey"></div>

    <div id="loading">
      <div class="loading-title">Santa's Christmas Journey</div>
      <svg class="loading-flake" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <path d="M20 3V37M5 11L35 29M35 11L5 29M20 3L15 8M20 3L25 8M20 37L15 32M20 37L25 32M5 11L6 18M5 11L12 10M35 29L34 22M35 29L28 30M35 11L34 18M35 11L28 10M5 29L6 22M5 29L12 30" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="20" cy="20" r="3" fill="currentColor"/>
      </svg>
      <div class="loading-sub">Warming up the sleigh</div>
    </div>

    <div id="rotate-hint" role="status" aria-live="polite">
      <div class="rotate-icon" aria-hidden="true">📱</div>
      <p>Rotate your device to landscape to play.</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
